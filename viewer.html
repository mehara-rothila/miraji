<!doctype html>
<html lang="si">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>පාඩම් සටහන් · Study Notes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #6b6a65;
      --line: #e4e2db;
      --accent: #1f6f50;
      --accent-text: #ffffff;
      --ghost-bg: #ecf3ef;
      --bar: rgba(246, 245, 241, .92);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141513;
        --card: #1e201d;
        --text: #ecebe6;
        --muted: #a3a29b;
        --line: #2f322d;
        --accent: #5fc59a;
        --accent-text: #0e1a14;
        --ghost-bg: #23302a;
        --bar: rgba(20, 21, 19, .92);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Sinhala", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    .bar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: var(--bar);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
    }
    .bar a { text-decoration: none; font-weight: 600; }
    .back { color: var(--accent); white-space: nowrap; }
    .title { flex: 1; min-width: 0; }
    .title strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title span { display: block; color: var(--muted); font-size: .85rem; }
    .download {
      background: var(--accent);
      color: var(--accent-text);
      padding: 8px 14px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .bar a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    #pages {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .page {
      position: relative;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .page canvas { display: block; width: 100%; height: 100%; }
    .page .num {
      position: absolute;
      right: 8px;
      bottom: 8px;
      font-size: .78rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .55);
      color: #fff;
    }
    .status { text-align: center; color: var(--muted); padding: 48px 16px; }
    .status a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <div class="bar">
    <a class="back" href="./">← ආපසු</a>
    <div class="title"><strong id="title">…</strong><span id="sub"></span></div>
    <a class="download" id="download" href="#" download>බාගන්න</a>
  </div>
  <div id="pages"><p class="status" id="status">පූරණය වෙමින්… · Loading…</p></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    const DOCS = {
      "heredity": { file: "Heredity.pdf", title: "ආවේණිය", en: "Heredity" },
      "solar-system": { file: "Solar_System.pdf", title: "සෞරග්‍රහ මණ්ඩලය", en: "The Solar System" },
    };
    const doc = DOCS[new URLSearchParams(location.search).get("doc")];
    const pagesEl = document.getElementById("pages");
    const statusEl = document.getElementById("status");

    function fail(html) {
      statusEl.innerHTML = html;
    }

    if (!doc) {
      fail('මෙම සටහන හමු නොවීය. <a href="./">ආපසු යන්න</a>');
    } else {
      document.title = doc.title + " · " + doc.en;
      document.getElementById("title").textContent = doc.title;
      document.getElementById("sub").textContent = doc.en;
      document.getElementById("download").href = doc.file;
      load();
    }

    async function load() {
      if (!window.pdfjsLib) {
        fail('PDF එක මෙහි පෙන්විය නොහැක. <a href="' + doc.file + '">PDF එක විවෘත කරන්න</a>');
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      try {
        const pdf = await pdfjsLib.getDocument(doc.file).promise;
        document.getElementById("sub").textContent = doc.en + " · පිටු " + pdf.numPages;

        // Render each page only when it scrolls near the screen, to keep phones fast.
        const observer = new IntersectionObserver((entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) {
              observer.unobserve(entry.target);
              render(entry.target);
            }
          }
        }, { rootMargin: "800px 0px" });

        // Lay out every page straight away using page 1's shape; each page is fetched when it is drawn.
        const first = (await pdf.getPage(1)).getViewport({ scale: 1 });
        statusEl.remove();
        for (let n = 1; n <= pdf.numPages; n++) {
          const slot = document.createElement("div");
          slot.className = "page";
          slot.style.aspectRatio = first.width + " / " + first.height;
          slot.innerHTML = '<span class="num">' + n + " / " + pdf.numPages + "</span>";
          slot.pdf = pdf;
          slot.pageNumber = n;
          pagesEl.append(slot);
          observer.observe(slot);
        }
      } catch (err) {
        fail('PDF එක පූරණය කළ නොහැක. <a href="' + doc.file + '">PDF එක විවෘත කරන්න</a>');
      }
    }

    async function render(slot) {
      const page = await slot.pdf.getPage(slot.pageNumber);
      const base = page.getViewport({ scale: 1 });
      slot.style.aspectRatio = base.width + " / " + base.height;
      const scale = (slot.clientWidth / base.width) * Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale });
      const canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
      slot.prepend(canvas);
    }
  </script>
</body>
</html>
